<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Phone + USB plug: a tether glyph, not wifi waves. -->
  <g fill="none" fill-rule="evenodd">
    <rect x="2" y="1" width="12" height="22" rx="2.5" fill="#3DDC97"/>
    <rect x="4.2" y="4.2" width="7.6" height="13.2" rx="1" fill="#10241A"/>
    <rect x="6.4" y="18.6" width="3.2" height="1.6" rx="0.8" fill="#10241A"/>
    <!-- USB-A sticking out the right = tethering -->
    <path fill="#3DDC97" d="M14 9.2h2.2V8h5.3c.6 0 1 .4 1 1v6c0 .6-.4 1-1 1h-5.3v-1.2H14z"/>
    <rect x="17.4" y="10.2" width="3.2" height="3.6" rx="0.4" fill="#10241A"/>
  </g>
</svg>
